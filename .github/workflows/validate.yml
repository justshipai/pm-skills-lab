name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate skill structure
        run: python3 scripts/validate.py

# Structural validation runs in CI (files present, frontmatter + JSON well-formed).
# The eval itself — scripts/run_evals.py, which compares the skill against the
# no-skill baseline — needs an LLM API key and costs money, so it is NOT run on
# every PR. Contributors run it locally and commit evals/RESULTS.md; a maintainer
# re-runs it before merge. See CONTRIBUTING.md.
#
# To run evals in CI, add ANTHROPIC_API_KEY as a repo secret and a step:
#   - run: python3 scripts/run_evals.py
#     env: { ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} }
